schema_version: "1.0"

pricing:
  drops_per_rainy_visit: 10
  first_rain_bonus_drops: 30
  tiers:
    small:
      price: 30
      estimated_rainy_visits: 3
    medium:
      price: 50
      estimated_rainy_visits: 5
    large:
      price: 100
      estimated_rainy_visits: 10

notes:
  - 価格は通常の雨の日1回につき10滴を基準とする。
  - 初めて雨の日に訪れたときは、小さい家具を1つ交換できる30滴を受け取る。
  - 家具説明文と季節制限はプロトタイプでは持たせない。
  - 配置可能場所は配置スロットIDで管理する。
  - 画像ファイル名は仮称であり、アセット制作時に変更してよい。

